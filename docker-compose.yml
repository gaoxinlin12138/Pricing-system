name: pricing

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricing}
      POSTGRES_USER: ${POSTGRES_USER:-pricing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pricing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pricing}
      SESSION_SECRET: ${SESSION_SECRET:?请先在 .env 里设置 SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?请在 .env 里设置 INITIAL_ADMIN_PASSWORD}
      INITIAL_EMPLOYEE_PASSWORD: ${INITIAL_EMPLOYEE_PASSWORD:?请在 .env 里设置 INITIAL_EMPLOYEE_PASSWORD}
    volumes:
      - pricing-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # 只监听本机，由宿主机 Nginx 反向代理 80/443；不直接对公网暴露 8080
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pricing-data:
  postgres-data:
